name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "再デプロイするコミット（ロールバック用。このブランチの過去のコミット）"
        required: true
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
  actions: read   # ロールバック先が過去にデプロイに成功したかを確かめる
jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: ci
    # push は CI 通過後のみ。手動の再デプロイ（ロールバック）は、過去に CI を通ったコミットを使う
    if: always() && (needs.ci.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.ci.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
      DEPLOYER_SA: ${{ vars.DEPLOYER_SA }}
      REGION: ${{ vars.REGION }}
      VERTEX_LOCATION: ${{ vars.VERTEX_LOCATION }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      DEPLOY_REF: ${{ inputs.ref || github.sha }}
    steps:
      # 1つでも空なら、認証やビルドの前に止める。空のまま Cloud Run に渡すと、デプロイは成功しても Gemini が動かないため
      # 一覧は infra/setup-deployer.sh の表示と同じ（tests/config.test.sh が一致を確かめる）
      - name: Check repository Variables
        run: |
          missing=""
          for v in PROJECT_ID REGION VERTEX_LOCATION GEMINI_MODEL WIF_PROVIDER DEPLOYER_SA; do
            [ -n "$(printf '%s' "${!v}" | tr -d '[:space:]')" ] || missing="${missing} ${v}"
          done
          if [ -n "$missing" ]; then
            echo "::error::GitHub の Variables が未登録です:${missing}。infra/setup-deployer.sh の表示どおりに Settings → Secrets and variables → Actions → Variables に登録してください"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}
          fetch-depth: 0
      - name: The commit must belong to this branch
        run: git merge-base --is-ancestor "$(git rev-parse HEAD)" "origin/${GITHUB_REF_NAME}"
      - name: Roll back only to a commit that deployed successfully before
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          N=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --commit "$SHA" --status success --json databaseId --jq length)
          [ "$N" -gt 0 ] || { echo "::error::${SHA} は過去にデプロイが成功していません。成功したコミットは Actions の deploy の一覧で確かめてください"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - run: npm ci --prefix firebase
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: 1/3 Firestore and Storage rules, indexes
        run: node infra/deploy-rules.mjs --apply
      - name: 2/3 API (Cloud Run)
        run: |
          SHA=$(git rev-parse HEAD)
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/app/api:${SHA}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -f api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          gcloud run deploy api --project "$PROJECT_ID" --region "$REGION" --image "$IMAGE" \
            --service-account "api-runtime@${PROJECT_ID}.iam.gserviceaccount.com" \
            --allow-unauthenticated --labels "commit=${SHA:0:12}" \
            --cpu 2 --memory 2Gi --concurrency 8 --min-instances 0 --max-instances 2 \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=${PROJECT_ID},VERTEX_LOCATION=${VERTEX_LOCATION},GEMINI_MODEL=${GEMINI_MODEL},GEMINI_MOCK=0"
      - name: 3/3 Web (App Hosting)
        run: firebase/node_modules/.bin/firebase deploy --only apphosting:web --project "$PROJECT_ID" --non-interactive
      - name: Record what is deployed
        run: |
          REV=$(gcloud run services describe api --project "$PROJECT_ID" --region "$REGION" --format='value(status.latestReadyRevisionName)')
          {
            echo "### Deployed to ${PROJECT_ID}"
            echo "| 項目 | 値 |"
            echo "|---|---|"
            echo "| コミット | $(git rev-parse HEAD) |"
            echo "| API リビジョン | ${REV} |"
            echo "| Firestore/Storage Rules・Web | 同じコミットから反映 |"
            echo "| 実行者 | ${GITHUB_ACTOR}（${GITHUB_EVENT_NAME}） |"
          } >> "$GITHUB_STEP_SUMMARY"
