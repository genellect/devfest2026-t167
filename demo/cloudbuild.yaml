steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -f, demo/Dockerfile, -t, '${_IMAGE}', --build-arg, 'FIREBASE_API_KEY=${_FIREBASE_API_KEY}', --build-arg, 'FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}', --build-arg, 'FIREBASE_PROJECT_ID=${PROJECT_ID}', --build-arg, 'FIREBASE_APP_ID=${_FIREBASE_APP_ID}', .]
images: ['${_IMAGE}']
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
